<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b0c0e">
  <meta name="description" content="个人成长指数：把人当一支股票，对话录入、确定性引擎、可复算周 K。">
  <title>Personal Economy · 个人成长指数</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%2317181d'/%3E%3Crect x='9' y='12' width='3' height='9' rx='1.5' fill='%23e4e6eb'/%3E%3Crect x='14.5' y='8' width='3' height='16' rx='1.5' fill='%238dd8ad'/%3E%3Crect x='20' y='11' width='3' height='11' rx='1.5' fill='%23e4e6eb'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="./style.css">
  <script type="module" src="./app.js"></script>
</head>
<body>
  <div class="workspace" data-mode="market">
    <header class="topbar">
      <div class="brand"><span class="mark" aria-hidden="true"><i></i><i></i><i></i></span>Personal Economy</div>
      <div class="toolbar">
        <div class="data-switch" role="group" aria-label="数据视图">
          <button id="view-sample" type="button" aria-pressed="true">样例</button>
          <button id="view-personal" type="button" aria-pressed="false">我的</button>
        </div>
        <span class="model-status" id="model-status"><i></i><span id="model-status-text">检测中</span></span>
        <button id="view-toggle" type="button" hidden>返回行情</button>
        <button id="reset" type="button">重置对话</button>
      </div>
    </header>

    <main class="stage" aria-label="个人成长指数与对话">
      <section class="market" aria-labelledby="market-title">
        <div class="market-summary">
          <div>
            <h1 id="market-title">个人成长指数 <span class="data-tag" id="data-tag">样例人生</span></h1>
            <div class="quote"><strong id="quote-value">—</strong><span id="quote-change">—</span></div>
          </div>
          <dl class="market-stats">
            <div><dt>本周开盘</dt><dd id="stat-open">—</dd></div>
            <div><dt>本周最高</dt><dd id="stat-high">—</dd></div>
            <div><dt>本周最低</dt><dd id="stat-low">—</dd></div>
          </dl>
        </div>
        <div class="chart">
          <div class="chart-heading"><span>走势</span><span>周 K · 点击看明细</span></div>
          <div class="plot"><canvas id="candles" role="img" aria-label="周 K 走势"></canvas></div>
        </div>
      </section>

      <section class="conversation" aria-label="对话">
        <header class="conversation-heading"><h2>对话</h2></header>
        <div class="message-scroll" tabindex="0" aria-label="消息记录">
          <div class="messages" role="log" aria-live="polite" aria-relevant="additions"></div>
          <p class="empty">今天发生了什么？</p>
        </div>
      </section>
      <div class="conversation-budget" aria-hidden="true"></div>
    </main>

    <footer class="compose-area">
      <div class="examples" aria-label="试一句">
        <button type="button">今天有点焦虑，但还是去跑了五公里。</button>
        <button type="button">今天完成了数据库课设。</button>
        <button type="button">今天有点累，想休息一天。</button>
      </div>
      <form class="composer">
        <label class="sr-only" for="entry">输入消息</label>
        <textarea id="entry" rows="1" maxlength="1500" placeholder="说说今天发生的事…" aria-describedby="compose-hint"></textarea>
        <button class="send" type="submit" aria-label="发送" disabled><span aria-hidden="true">↑</span></button>
      </form>
      <p class="compose-hint" id="compose-hint">Enter 发送 <span>·</span> Shift + Enter 换行 <span>·</span> <em id="privacy-note">记录仅存本机浏览器</em></p>
    </footer>
  </div>

  <div class="drawer-scrim" id="drawer-scrim" hidden></div>
  <aside class="drawer" id="drawer" hidden aria-label="计算明细与持仓">
    <header class="drawer-head">
      <div>
        <h2 id="drawer-title">计算明细</h2>
        <p class="drawer-sub" id="drawer-sub">—</p>
      </div>
      <button class="drawer-close" id="drawer-close" type="button" aria-label="关闭明细">×</button>
    </header>
    <div class="drawer-tabs" role="tablist">
      <button id="tab-detail" role="tab" aria-selected="true" type="button">本周明细</button>
      <button id="tab-tasks" role="tab" aria-selected="false" type="button">持仓任务</button>
    </div>
    <div class="drawer-body" id="drawer-body"></div>
  </aside>
</body>
</html>
